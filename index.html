<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scoreboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scoreboard">

        <!-- HOME TEAM -->
        <section class="team team-home">

            <select id="team1">
                <option value="">Select a Nation</option>
            </select>

            <div class="teamInfo homeInfo">

                <div
                    id="cards1"
                    class="red-card-container"
                    aria-label="Home red cards"
                ></div>

                <img
                    id="flag1"
                    src="DefaultNationsFlag.png"
                    alt="Select a Nation"
                    class="team-flag"
                >

                <span id="code1">NAT</span>

            </div>

            <input
                type="text"
                id="score1"
                inputmode="numeric"
                autocomplete="off"
                maxlength="2"
                value=""
                aria-label="Home score"
            >

        </section>


        <!-- CENTER -->
        <section class="center">

            <div
                id="competitionName"
                class="competition-name"
            ></div>

            <button
                type="button"
                class="edition"
                aria-label="Competition"
            >
                🤝
            </button>

        </section>


        <!-- AWAY TEAM -->
        <section class="team team-away">

            <select id="team2">
                <option value="">Select a Nation</option>
            </select>

            <div class="teamInfo awayInfo">

                <span id="code2">NAT</span>

                <img
                    id="flag2"
                    src="DefaultNationsFlag.png"
                    alt="Select a Nation"
                    class="team-flag"
                >

                <div
                    id="cards2"
                    class="red-card-container"
                    aria-label="Away red cards"
                ></div>

            </div>

            <input
                type="text"
                id="score2"
                inputmode="numeric"
                autocomplete="off"
                maxlength="2"
                value=""
                aria-label="Away score"
            >

        </section>

    </main>


    <!-- PENALTY TOGGLE -->
    <div class="penaltyToggle">

        <label>

            <input
                type="checkbox"
                id="showPenalties"
            >

            Show Penalties

        </label>

    </div>


    <!-- PENALTIES -->
    <div
        id="penalties"
        class="penalties"
    >

        <!-- HOME PENALTIES -->
        <div class="penaltyTeam">

            <img
                id="penFlag1"
                src="DefaultNationsFlag.png"
                alt="Select a Nation"
                class="penalty-flag"
            >

            <h3 id="penCode1">NAT</h3>

            <input
                type="text"
                id="penalty1"
                inputmode="numeric"
                autocomplete="off"
                maxlength="2"
                value=""
                disabled
                aria-label="Home penalties"
            >

        </div>


        <!-- AWAY PENALTIES -->
        <div class="penaltyTeam awayPenalty">

            <input
                type="text"
                id="penalty2"
                inputmode="numeric"
                autocomplete="off"
                maxlength="2"
                value=""
                disabled
                aria-label="Away penalties"
            >

            <h3 id="penCode2">NAT</h3>

            <img
                id="penFlag2"
                src="DefaultNationsFlag.png"
                alt="Select a Nation"
                class="penalty-flag"
            >

        </div>

    </div>


    <!-- IMPORTANT:
         teams.js MUST BE LOADED BEFORE script.js -->
    <script src="teams.js"></script>
    <script src="script.js"></script>

</body>

</html>
